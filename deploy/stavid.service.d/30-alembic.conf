# Drop-in override for stavid.service that runs `alembic upgrade head`
# before the bot starts. Install once with:
#
#   sudo install -m 0644 -D \
#     /opt/stavid/deploy/stavid.service.d/30-alembic.conf \
#     /etc/systemd/system/stavid.service.d/30-alembic.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart stavid
#
# After that every restart (including Sentinel auto-deploys after a PR
# merge) applies any new migrations automatically before the bot starts,
# so you never have to SSH in and run alembic by hand again.
#
# Failure mode: if the upgrade fails, systemd refuses to start the bot.
# Check `journalctl -u stavid` and run alembic by hand to diagnose.

[Service]
ExecStartPre=/opt/stavid/venv/bin/alembic -c /opt/stavid/alembic.ini upgrade head
